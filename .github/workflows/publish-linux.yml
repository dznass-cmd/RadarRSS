name: Publish Linux Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-linux-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 xvfb
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run lint
      - run: npm run build:linux
      - name: Test packaged application
        run: xvfb-run -a node scripts/smoke-linux.cjs
      - name: Publish validated Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            python3 - <<'PYNOTES' > /tmp/linux-release-notes.md
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          print(text.split('## [', 1)[1].split('\n', 1)[1].split('\n## [', 1)[0].strip())
          PYNOTES
            gh release create "$tag" --target "$GITHUB_SHA" --title "Radar RSS $tag" --notes-file /tmp/linux-release-notes.md --draft
          fi
          shopt -s nullglob
          assets=(release/*.AppImage release/*.AppImage.blockmap release/*.deb release/latest-linux.yml)
          gh release upload "$tag" "${assets[@]}" --clobber
          # Keep the release draft until the coordinated cross-platform publication.
