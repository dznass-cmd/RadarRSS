name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Java 21 → 17 compatibility
        run: |
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' \
            android/app/capacitor.build.gradle \
            node_modules/@capacitor/android/capacitor/build.gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Get version tag
        id: tag
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk Radar-RSS-${{ steps.tag.outputs.version }}.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          files: Radar-RSS-${{ steps.tag.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
