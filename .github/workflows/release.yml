# Builda o app Windows e publica a release no GitHub automaticamente.
#
# Como usar:
#   1. Aumente a "version" no package.json (ex.: 2.0.4)
#   2. Crie e envie uma tag:  git tag v2.0.4 && git push origin v2.0.4
#
# O workflow valida que a tag bate com o package.json, builda e sobe os
# arquivos (instalador + portátil + latest.yml + blockmap) como release.
# O app instalado detecta e instala a atualização sozinho.

name: Publicar Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar versão da tag
        shell: bash
        run: |
          node -e "
            const v = require('./package.json').version;
            const tag = '${{ github.ref_name }}'.replace(/^v/, '');
            if (v !== tag) {
              console.error('A versão no package.json (' + v + ') não bate com a tag (' + tag + ').');
              process.exit(1);
            }
            console.log('Versão ' + v + ' confirmada para a tag ' + tag);
          "

      - name: Instalar dependências
        run: npm ci

      - name: Gerar ícone e buildar
        run: |
          npm run make-icon
          npm run build

      - name: Empacotar e publicar release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
