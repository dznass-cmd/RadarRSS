[package]
name = "radar-rss"
version = "0.2.0"
description = "Radar RSS Desktop"
authors = ["Dzerivado"]
license = "MIT"
repository = "https://github.com/dznass-cmd/RadarRSS"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "radar_rss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
